[tool.poetry]
name = "pdf-qa"
version = "0.1.0"
description = "CLI tool for Q&A over research papers using RAG and Ollama"
authors = ["Developer <developer@example.com>"]
readme = "README.md"
packages = [{include = "pdf_qa", from = "src"}]

[tool.poetry.dependencies]
# Target Python 3.11 for maximum library stability
python = "^3.11"

# CLI & Display
typer = {extras = ["all"], version = "^0.12.0"}
click = ">=8.1.0,<8.2.0"
rich = "^13.7.0"

# Configuration & Models
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"

# PDF Processing
pymupdf = "^1.24.0"
pillow = "^10.0.0"       # OCR support
pytesseract = "^0.3.10"  # OCR support (requires Tesseract installed)

# Vector Store
faiss-cpu = "^1.7.4"
numpy = "^1.24.0"

# LLM
ollama = "^0.4.0"

# Utilities
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
pdf-qa = "pdf_qa.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=pdf_qa --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"